# Jenga APK (Trusted Web Activity) kutoka PWA yako
# Actions → Build APK → Run workflow → weka URL ya Vercel
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL ya app (mf. https://nekeza.vercel.app)'
        required: true
        default: 'https://nekeza.vercel.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses (non-interactive)
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "33b6a2b64607f11b759f320ef9dff4ae5af3353d\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "e9acab5b5f89b8e2e6c7a8d8e8e8e8e8e8e8e8e8\n" > "$ANDROID_HOME/licenses/android-googlexr-license" || true
          # Also pipe yes for any remaining
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          tail -20 /tmp/sdk-licenses.log || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/tmp/sdk-install.log 2>&1 || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          tail -5 /tmp/sdk-install.log || true

      - name: Resolve app URL
        id: url
        run: |
          APP_URL="${{ github.event.inputs.app_url }}"
          APP_URL="${APP_URL%/}"
          HOST=$(echo "$APP_URL" | sed -e 's#https://##' -e 's#http://##' -e 's#/.*##')
          echo "value=$APP_URL" >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "Building TWA for $APP_URL (host=$HOST)"

      - name: Prepare Android project
        run: |
          set -e
          cp -r android-twa "$RUNNER_TEMP/twa"
          APP_URL="${{ steps.url.outputs.value }}"
          HOST="${{ steps.url.outputs.host }}"
          sed -i "s|__TWA_HOST__|$HOST|g" "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"
          sed -i "s|__TWA_URL__|$APP_URL|g" "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"
          cat "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/twa
        run: |
          set -e
          # Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Use system gradle to generate wrapper then build
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekeza-apk
          path: ${{ runner.temp }}/twa/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
