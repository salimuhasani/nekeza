# Jenga APK (Trusted Web Activity) kutoka PWA
# Actions → Build APK → Run workflow → weka URL ya Vercel
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL ya app (mf. https://nekeza.vercel.app)'
        required: true
        default: 'https://nekeza.vercel.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Usitumie android-actions/setup-android — inakwama kwenye licenses
      - name: Configure Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5af3353d" > "$ANDROID_HOME/licenses/google-gdk-license"

          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/tmp/lic.log 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Resolve app URL
        id: url
        run: |
          APP_URL="${{ github.event.inputs.app_url }}"
          APP_URL="${APP_URL%/}"
          HOST=$(echo "$APP_URL" | sed -e 's#https://##' -e 's#http://##' -e 's#/.*##')
          echo "value=$APP_URL" >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "Building TWA for $APP_URL (host=$HOST)"

      - name: Prepare Android project
        run: |
          set -e
          cp -r android-twa "$RUNNER_TEMP/twa"
          APP_URL="${{ steps.url.outputs.value }}"
          HOST="${{ steps.url.outputs.host }}"
          sed -i "s|__TWA_HOST__|$HOST|g" "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"
          sed -i "s|__TWA_URL__|$APP_URL|g" "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/twa/local.properties"
          cat "$RUNNER_TEMP/twa/app/src/main/res/values/strings.xml"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/twa
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekeza-apk
          path: ${{ runner.temp }}/twa/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
