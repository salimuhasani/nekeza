# Jenga APK (Trusted Web Activity) kutoka PWA yako
# Trigger: Actions → Build APK → Run workflow
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL ya app (mf. https://nekeza.vercel.app)'
        required: true
        default: 'https://nekeza.vercel.app'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Resolve app URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.app_url }}" ]; then
            echo "value=${{ github.event.inputs.app_url }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ vars.APP_PUBLIC_URL }}" ]; then
            echo "value=${{ vars.APP_PUBLIC_URL }}" >> $GITHUB_OUTPUT
          else
            echo "value=https://nekeza.vercel.app" >> $GITHUB_OUTPUT
          fi

      - name: Init TWA (non-interactive)
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          APP_URL="${{ steps.url.outputs.value }}"
          APP_URL="${APP_URL%/}"
          echo "Building TWA for $APP_URL"
          # Generate minimal twa-manifest
          cat > twa-manifest.json << EOF
          {
            "packageId": "app.nekeza.twa",
            "host": "$(echo "$APP_URL" | sed -e 's#https://##' -e 's#http://##' -e 's#/.*##')",
            "name": "NEKEZA",
            "launcherName": "NEKEZA",
            "display": "standalone",
            "themeColor": "#1e3a8a",
            "navigationColor": "#1e3a8a",
            "backgroundColor": "#1e3a8a",
            "startUrl": "/",
            "iconUrl": "$APP_URL/static/android-chrome-512x512.png",
            "maskableIconUrl": "$APP_URL/static/android-chrome-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "$APP_URL/manifest.webmanifest",
            "fallbackType": "customtabs",
            "enableNotifications": true,
            "features": {
              "playBilling": { "enabled": false },
              "locationDelegation": { "enabled": false }
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "$APP_URL/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF
          # bubblewrap init from existing manifest
          npx --yes @bubblewrap/cli init --manifest "$APP_URL/manifest.webmanifest" \
            --directory twa \
            --chromeosonly false \
            --no-prompt \
            || true
          # Fallback: use pre-bundled android-twa if bubblewrap init fails interactively
          if [ ! -d twa ]; then
            echo "Bubblewrap init needs manual fingerprints; using android-twa template"
            cp -r "${{ github.workspace }}/android-twa" twa
            # inject host into strings if template supports it
            HOST=$(echo "$APP_URL" | sed -e 's#https://##' -e 's#http://##' -e 's#/.*##')
            if [ -f twa/app/src/main/res/values/strings.xml ]; then
              sed -i "s|__TWA_HOST__|$HOST|g" twa/app/src/main/res/values/strings.xml
              sed -i "s|__TWA_URL__|$APP_URL|g" twa/app/src/main/res/values/strings.xml
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        working-directory: ${{ runner.temp }}/twa
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            gradle wrapper --gradle-version 8.2 || true
            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon
            else
              gradle assembleDebug --no-daemon
            fi
          fi

      - name: Find APK
        id: apk
        working-directory: ${{ runner.temp }}/twa
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found $APK"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekeza-apk
          path: ${{ runner.temp }}/twa/${{ steps.apk.outputs.path }}
          if-no-files-found: error
