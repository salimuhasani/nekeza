{% extends "base.html" %}
{% block content %}

<style>
.container-card {
    max-width: 600px;
    margin: 50px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.title {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 25px;
    font-weight: 600;
}

.form-group {
    margin-bottom: 18px;
}

label {
    font-weight: 500;
    display: block;
    margin-bottom: 6px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
    transition: 0.2s;
}

input:focus, select:focus, textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
}

.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.btn-danger {
    background: #ef4444;
    color: white;
}

.btn-danger:hover {
    background: #dc2626;
}

.btn-secondary {
    background: #3b82f6;
    color: white;
    text-align: center;
    display: block;
    text-decoration: none;
}

.btn-secondary:hover {
    background: #2563eb;
}

.button-group {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
</style>

<div class="container-card">
    <h2 class="title">Rekodi Kasoro / Expired</h2>

    <form method="POST">

        <div class="form-group">
            <label>Bidhaa</label>
            <select name="product_id" required>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.quantity }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Idadi</label>
            <input type="number" name="quantity" min="1" required>
        </div>

        <div class="form-group">
            <label>Sababu</label>
            <textarea name="reason" rows="4" required placeholder="Mfano: Imeharibika, Imeisha muda, n.k."></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-danger">
                Rekodi Kasoro (Pending Approval)
            </button>

            <a href="{{ url_for('my_defects') }}" class="btn btn-secondary">
                 Review ya Kasoro Zangu
            </a>
        </div>

    </form>
</div>

{% endblock %}
