{% extends "base.html" %}
{% block title %}Tuma Notification · {{ app_name }}{% endblock %}
{% block content %}
<style>
.ns-wrap { max-width: 520px; margin: 0 auto; padding: 0 2px 18px; }

.ns-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #64748b;
  text-decoration: none;
  margin-bottom: 8px;
}
.ns-back:hover { color: #1e3a8a; }

.ns-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(15,23,42,.05);
}
.ns-card h1 {
  margin: 0 0 12px;
  font-size: 1.05rem;
  font-weight: 700;
  color: #1e3a8a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ns-card h1 svg { width: 18px; height: 18px; }

.field { margin-bottom: 10px; }
.field label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: #475569;
  margin-bottom: 3px;
}
.field input,
.field textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  background: #f8fafc;
  outline: none;
  line-height: 1.5;
}
.field textarea {
  min-height: 120px;
  resize: vertical;
  white-space: pre-wrap;
}
.field input:focus,
.field textarea:focus {
  border-color: #3b82f6;
  background: #fff;
}

.mode-label {
  font-weight: 700;
  font-size: 0.72rem;
  color: #475569;
  display: block;
  margin-bottom: 6px;
}
.mode-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.mode-row label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  background: #f8fafc;
}
.mode-row input { accent-color: #1e3a8a; }

.targets {
  max-height: 180px;
  overflow: auto;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 6px;
  margin-bottom: 12px;
  background: #f8fafc;
}
.targets label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
}
.targets label:hover { background: #fff; }
.targets.disabled { opacity: .45; pointer-events: none; }
.targets .muted { color: #94a3b8; font-size: 0.72rem; }

.btn-submit {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  background: #1e3a8a;
  color: #fff;
  cursor: pointer;
}
.btn-submit:hover { background: #1e40af; }
</style>

<div class="ns-wrap">
  <a href="{{ url_for('notifications_list') }}" class="ns-back">← Rudi</a>
  <div class="ns-card">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Tuma notification
    </h1>

    <form method="post">
      <div class="field">
        <label>Kichwa</label>
        <input name="title" required maxlength="120" placeholder="Kichwa cha ujumbe">
      </div>
      <div class="field">
        <label>Ujumbe</label>
        <textarea name="body" required maxlength="500" rows="6" placeholder="Andika ujumbe...&#10;&#10;Unaweza kutenganisha aya.&#10;@jina linabaki kama ulivyoandika."></textarea>
      </div>
      <div class="field">
        <label>Link (hiari)</label>
        <input name="link" value="/notifications" maxlength="200" placeholder="/sales">
      </div>

      <span class="mode-label">Mpokeaji</span>
      <div class="mode-row">
        <label><input type="radio" name="mode" value="one" id="modeOne"> Mmoja</label>
        <label><input type="radio" name="mode" value="many" id="modeMany"> Kadhaa</label>
        <label><input type="radio" name="mode" value="all" id="modeAll" checked> Wote ({{ audience_label }})</label>
      </div>

      <div class="targets" id="targetsBox">
        {% for t in targets %}
        <label>
          <input type="checkbox" name="user_ids" value="{{ t.id }}" class="uid">
          <span><strong>{{ t.username }}</strong> <span class="muted">({{ t.role }})</span></span>
        </label>
        {% else %}
        <p class="muted" style="padding:8px;margin:0">Hakuna {{ audience_label|lower }}.</p>
        {% endfor %}
      </div>

      <button class="btn-submit" type="submit">Tuma</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var box = document.getElementById('targetsBox');
  var radios = document.querySelectorAll('input[name=mode]');
  var checks = document.querySelectorAll('.uid');
  function sync(){
    var mode = (document.querySelector('input[name=mode]:checked')||{}).value || 'all';
    if (mode === 'all') {
      box.classList.add('disabled');
      checks.forEach(function(c){ c.checked = false; });
    } else {
      box.classList.remove('disabled');
      if (mode === 'one') {
        checks.forEach(function(c){
          c.addEventListener('change', function(){
            if (c.checked) {
              checks.forEach(function(o){ if (o !== c) o.checked = false; });
            }
          });
        });
      }
    }
  }
  radios.forEach(function(r){ r.addEventListener('change', sync); });
  sync();
})();
</script>
{% endblock %}
